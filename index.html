<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snack Zone Advent</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#4a0aa6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Rubik:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="collage" aria-hidden="true">
    <img class="c-cookie" src="assets/cookie.webp" alt="">
    <img class="c-pizza" src="assets/pizza.webp" alt="">
    <img class="c-taco" src="assets/taco.webp" alt="">
    <img class="c-chips" src="assets/chips.webp" alt="">
    <img class="c-bolt-g" src="assets/bolt-green.webp" alt="">
    <img class="c-bolt-p" src="assets/bolt-pink.webp" alt="">
  </div>

  <header class="hero">
    <h1 class="logo-stack">
      <img class="shapes" src="assets/shapes.webp" alt="">
      <img class="snackzone" src="assets/snack-zone-logo.webp" alt="The Snack Zone">
      <img class="advent" src="assets/advent-calendar-logo.webp" alt="Advent Calendar">
    </h1>
  </header>

  <main>
    <div id="grid" class="grid" aria-label="Advent calendar"></div>
  </main>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="modal-backdrop" data-close></div>
    <article class="card">
      <button class="close" data-close aria-label="Close">×</button>
      <div class="ticket-head">
        <span class="day-badge" id="card-day"></span>
      </div>
      <h2 id="card-title"></h2>
      <dl class="facts">
        <div><dt>Stored in</dt><dd id="card-storage"></dd></div>
        <div><dt>From</dt><dd id="card-episode"></dd></div>
        <div><dt>Country</dt><dd id="card-country"></dd></div>
      </dl>
      <p id="spoiler" class="spoiler" hidden>⚠️ Spoilers for future days could be in this segment!</p>
      <div id="video-tabs" class="video-tabs"></div>
      <div class="video" id="video"></div>
      <a id="video-link" class="yt-link" target="_blank" rel="noopener">Open on YouTube ↗</a>
    </article>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
